name: Hi5Kernel VM qualification
on:
  workflow_dispatch:
  push:
    branches: [main, 'dev/**']
permissions:
  contents: read
jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install VM and image tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools dosfstools python3-pil fonts-dejavu-core
      - name: Set up pinned Rust
        run: |
          rustup show
          rustup target add x86_64-unknown-uefi
          rustc --version
      - name: Test the diagnostic validator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build UEFI image
        run: bash scripts/build.sh
      - name: Qualify 256 MiB VM
        run: python3 scripts/smoke.py --memory 256
      - name: Qualify 512 MiB VM
        run: python3 scripts/smoke.py --memory 512
      - name: Qualify 1024 MiB VM
        run: python3 scripts/smoke.py --memory 1024
      - name: Persistent document cold boot test
        run: python3 scripts/persistence.py
      - name: Restricted native HTTP binary download test
        run: python3 scripts/network.py
      - name: HTTP close-delimited binary download
        run: python3 scripts/network.py close
      - name: HTTP chunked binary download
        run: python3 scripts/network.py chunked
      - name: DHCP DNS and routed HTTP on isolated alternate subnet
        run: python3 scripts/routed.py
      - name: Retain image and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hi5os-v0.1.4-vm-evidence
          path: dist/
          if-no-files-found: warn
          retention-days: 14
