name: Hi5Kernel VM qualification
on:
  workflow_dispatch:
  push:
    branches: [main, 'dev/**']
permissions:
  contents: read
jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install VM and image tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools dosfstools python3-pil fonts-dejavu-core clang lld p7zip-full python3-pefile python3-olefile python3-cryptography ca-certificates curl msitools
      - name: Set up pinned Rust
        run: |
          rustup show
          rustup target add x86_64-unknown-uefi
          rustc --version
      - name: Test the diagnostic validator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build UEFI image
        run: bash scripts/build.sh
      - name: Qualify 256 MiB VM
        run: python3 scripts/smoke.py --memory 256
      - name: Qualify 512 MiB VM
        run: python3 scripts/smoke.py --memory 512 --display-test
      - name: Qualify 1024 MiB VM
        run: python3 scripts/smoke.py --memory 1024
      - name: Clock and fail-closed entropy on CPU without RNG
        run: python3 scripts/smoke.py --memory 512 --cpu qemu64,-rdrand,-rdseed --security-test unavailable
      - name: Clock, hardware entropy and interactive Hi5Sheet
        run: python3 scripts/smoke.py --memory 512 --cpu max,+rdrand --security-test available
      - name: Persistent document cold boot test
        run: python3 scripts/persistence.py
      - name: First-run setup, cold login and lock (required)
        run: python3 scripts/account_setup.py
      - name: Native HTTPS certificate and hostname qualification (required)
        run: /usr/bin/python3 scripts/tls_qualify.py
      - name: Restricted native HTTP binary download test
        run: python3 scripts/network.py
      - name: Hi5Browser HTML link, redirect and byte-exact EXE download (required)
        run: sudo -n unshare --net bash -c 'ip link set lo up; exec runuser -u "$1" -- python3 scripts/network.py browse' bash "$USER"
      - name: HTTP close-delimited binary download
        run: sudo -n unshare --net bash -c 'ip link set lo up; exec runuser -u "$1" -- python3 scripts/network.py close' bash "$USER"
      - name: HTTP chunked binary download
        run: python3 scripts/network.py chunked
      - name: One MiB HTTP binary download and exact disk verification
        run: python3 scripts/network.py large
      - name: Official 7-Zip install, reboot, PE inspection and startup probe
        run: /usr/bin/python3 scripts/sevenzip.py
      - name: Offline bundled 7-Zip installation and startup test
        run: python3 scripts/offline7zip.py
      - name: Offline 7-Zip startup on alternate CPU model
        run: python3 scripts/offline7zip.py max
      - name: Genuine ZIP and 7z round trip (required)
        run: python3 scripts/archive7zip.py --require
      - name: Expanded archive, PE DLL GUI fixture and original live GUI (required)
        run: python3 scripts/archive7zip.py --extended --require-live
      - name: Original GUI EXE and MSI dependency inventory
        run: /usr/bin/python3 scripts/gui_inventory.py
      - name: DHCP DNS and routed HTTP on isolated alternate subnet
        run: python3 scripts/routed.py
      - name: Public BBC website diagnostic (non-blocking external network)
        continue-on-error: true
        timeout-minutes: 3
        run: python3 scripts/public_web.py
      - name: Public Google search diagnostic (non-blocking external network)
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/public_web.py --google
      - name: Retain image and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hi5os-v0.3.4-vm-evidence
          path: dist/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain UTM system image separately
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hi5os-v0.3.4-UTM
          path: |
            dist/hi5os-v0.3.4.img
            dist/hi5os-setup-data.img
            dist/BEARSSL-LICENSE.txt
            dist/STB-LICENSE.txt
          compression-level: 6
          if-no-files-found: error
          retention-days: 14
